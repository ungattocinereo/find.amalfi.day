name: Deploy to Stage

on:
  push:
    branches: [main]

concurrency:
  group: stage
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  STAGE_ALIAS: find-amalfi-day-stage.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --meta githubBranch="main" \
            --meta githubEnvironment="stage")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $URL"

      - name: Alias to stable stage URL
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "$STAGE_ALIAS" \
            --token=${{ secrets.VERCEL_TOKEN }}
          echo "Stage URL: https://$STAGE_ALIAS"
